<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShivaLali — Photorealistic Image & Cinematic Video Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            obsidian: '#09090B',
            surface: '#111116',
            violetGlow: '#7C3AED',
            goldAccent: '#F59E0B',
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #09090B;
      color: #F4F4F5;
      font-family: 'Inter', 'Plus Jakarta Sans', system-ui, sans-serif;
      margin: 0;
      overflow-x: hidden;
    }
    .studio-card {
      background: rgba(17, 17, 22, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.09);
    }
    .studio-dock {
      background: rgba(13, 13, 18, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .logo-frame {
      background: #F4F4F5;
      box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.35), 0 6px 20px rgba(0, 0, 0, 0.45);
    }
    .thirds-grid {
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.16) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.16) 1px, transparent 1px);
      background-size: 33.333% 33.333%;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(124,58,237,0.55); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const LOGO_SOURCES = [
      "./shivalai%20logo.jpg",
      "./shivalai logo.jpg",
      "shivalai%20logo.jpg",
      "shivalai logo.jpg"
    ];

    const ASPECT_RATIOS = [
      { id: '16:9', label: '16:9', subtitle: 'Widescreen Landscape', w: 640, h: 360, cssRatio: '16 / 9' },
      { id: '9:16', label: '9:16', subtitle: 'Vertical Fullscreen', w: 324, h: 576, cssRatio: '9 / 16' },
      { id: '4:5',  label: '4:5',  subtitle: 'Portrait Frame', w: 400, h: 500, cssRatio: '4 / 5' },
      { id: '2:3',  label: '2:3',  subtitle: 'Tall Editorial', w: 360, h: 540, cssRatio: '2 / 3' },
      { id: '1:1',  label: '1:1',  subtitle: 'Balanced Square', w: 460, h: 460, cssRatio: '1 / 1' },
      { id: '1.91:1', label: '1.91:1', subtitle: 'Campaign Wide', w: 668, h: 350, cssRatio: '1.91 / 1' },
      { id: '21:9', label: '21:9', subtitle: 'Cinema Ultrawide', w: 700, h: 300, cssRatio: '21 / 9' },
      { id: '4:3',  label: '4:3',  subtitle: 'Classic Studio', w: 560, h: 420, cssRatio: '4 / 3' },
    ];

    const STYLE_PRESETS = [
      { id: 'candid', name: 'Raw Candid Photo', tag: 'Natural & Unposed' },
      { id: 'product', name: 'Commercial Studio', tag: 'Clean & Crisp Detail' },
      { id: 'editorial', name: 'Editorial Lifestyle', tag: 'Rich Natural Light' },
      { id: 'cinema', name: 'Cinematic Film Still', tag: '35mm Anamorphic' },
      { id: 'drone', name: 'Aerial Perspective', tag: 'High-Altitude View' },
    ];

    const CAMERA_LENSES = ['24mm f/1.4', '35mm f/1.8', '50mm f/1.2', '85mm f/1.4', '16mm Ultra-Wide'];
    const LIGHTING_MODES = ['Golden Hour Natural', 'Rembrandt Studio', 'Moody Rim Light', 'Soft Diffused Daylight', 'Neon Night Rain'];
    const DEFAULT_NEGATIVE = 'cartoon, 3d render, plastic skin, wax figure, CGI, oversaturated, watermark, embedded gibberish text, distorted anatomy';

    function generateRandomSeed() {
      return Math.floor(100000 + Math.random() * 900000);
    }

    function enhancePromptText(rawPrompt, presetId, lens, lighting, mode, negativeText) {
      const base = rawPrompt.trim() || 'modern architectural glass villa overlooking misty hills at golden hour';
      const presetMap = {
        candid: 'unposed candid documentary photograph, natural skin pores and fine hair texture, authentic film grain, Kodak Portra 400 color science, clean uncluttered composition',
        product: 'hero commercial studio photography, crisp reflections, tactile surface micro-detail, balanced negative space, luxury lighting, campaign grade',
        editorial: 'high-end lifestyle editorial photography, balanced composition, natural depth of field, rich organic shadows, gallery print quality',
        cinema: 'cinematic film still, anamorphic lens flare, rich shadow falloff, atmospheric haze, ARRI Alexa 65 color grading, motion depth',
        drone: 'high-resolution aerial drone photograph, sweeping architectural and landscape scale, crisp atmospheric perspective, natural horizon light'
      };
      const motionSuffix = mode === 'video'
        ? ', smooth slow camera dolly movement, natural physics motion, 24fps cinematic cadence'
        : '';
      const neg = (negativeText || DEFAULT_NEGATIVE).trim();
      return `${base}, ${presetMap[presetId] || presetMap.editorial}, shot on ${lens}, ${lighting}, raw unedited photography, 8k resolution${motionSuffix} --no ${neg}`;
    }

    function renderProceduralCanvas(canvas, item) {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;

      const seedStr = (item.prompt || 'ShivaLali') + '-' + (item.seed || item.id);
      let hash = 2166136261;
      for (let i = 0; i < seedStr.length; i++) {
        hash ^= seedStr.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      const rand = () => {
        hash ^= hash << 13;
        hash ^= hash >>> 17;
        hash ^= hash << 5;
        return ((hash >>> 0) % 10000) / 10000;
      };

      const palettes = {
        candid: ['#1C1917', '#78350F', '#D97706', '#FDE68A'],
        product: ['#09090B', '#27272A', '#7C3AED', '#F59E0B'],
        editorial: ['#18181B', '#4C1D95', '#C084FC', '#FEF3C7'],
        cinema: ['#050816', '#1E1B4B', '#7C3AED', '#F59E0B'],
        drone: ['#0C192C', '#134E4A', '#0D9488', '#FDE68A']
      };
      const pal = palettes[item.preset] || palettes.cinema;

      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, pal[0]);
      grad.addColorStop(0.55, pal[1]);
      grad.addColorStop(1, pal[2]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < 8; i++) {
        const cx = rand() * w;
        const cy = rand() * h;
        const radius = (0.12 + rand() * 0.34) * Math.max(w, h);
        const orb = ctx.createRadialGradient(cx, cy, 2, cx, cy, radius);
        const col = i % 2 === 0 ? pal[3] : pal[2];
        orb.addColorStop(0, col + '52');
        orb.addColorStop(0.6, col + '16');
        orb.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = orb;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      const horizonY = h * (0.52 + (rand() - 0.5) * 0.16);
      ctx.fillStyle = 'rgba(9, 9, 11, 0.42)';
      ctx.beginPath();
      ctx.moveTo(0, h);
      for (let x = 0; x <= w + 40; x += 40) {
        const wave = Math.sin(x * 0.008 + rand() * 0.4) * (h * 0.06) + Math.cos(x * 0.02) * (h * 0.03);
        ctx.lineTo(x, horizonY + wave);
      }
      ctx.lineTo(w, h);
      ctx.closePath();
      ctx.fill();

      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const grain = (rand() - 0.5) * 16;
        data[i] = Math.min(255, Math.max(0, data[i] + grain));
        data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + grain));
        data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + grain));
      }
      ctx.putImageData(imgData, 0, 0);

      const vig = ctx.createRadialGradient(w * 0.5, h * 0.5, Math.min(w, h) * 0.25, w * 0.5, h * 0.5, Math.max(w, h) * 0.78);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(9,9,11,0.68)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, w, h);

      if (item.watermarked) {
        ctx.save();
        ctx.font = `700 ${Math.max(14, Math.round(Math.min(w, h) * 0.042))}px "Plus Jakarta Sans", sans-serif`;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.translate(w / 2, h / 2);
        ctx.rotate(-0.24);
        ctx.fillText('ShivaLali • Preview', 0, 0);
        ctx.restore();
      }
    }

    function BrandLogo() {
      const [srcIdx, setSrcIdx] = useState(0);
      const [broken, setBroken] = useState(false);

      if (broken || srcIdx >= LOGO_SOURCES.length) {
        return (
          <div className="w-10 h-10 rounded-full logo-frame flex items-center justify-center text-zinc-900 font-display font-extrabold text-xs tracking-tight shrink-0">
            SL
          </div>
        );
      }

      return (
        <div className="w-10 h-10 rounded-full logo-frame overflow-hidden flex items-center justify-center shrink-0">
          <img
            src={LOGO_SOURCES[srcIdx]}
            alt="ShivaLali"
            onError={() => {
              if (srcIdx + 1 < LOGO_SOURCES.length) {
                setSrcIdx(srcIdx + 1);
              } else {
                setBroken(true);
              }
            }}
            className="w-full h-full object-cover contrast-110"
          />
        </div>
      );
    }

    function App() {
      const [isOwner, setIsOwner] = useState(false);
      const [credits, setCredits] = useState(3);
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [focusMode, setFocusMode] = useState(false);

      const [mode, setMode] = useState('image');
      const [aspectRatio, setAspectRatio] = useState(ASPECT_RATIOS[0]);
      const [preset, setPreset] = useState('editorial');
      const [lens, setLens] = useState('35mm f/1.8');
      const [lighting, setLighting] = useState('Golden Hour Natural');
      const [seed, setSeed] = useState(() => generateRandomSeed());
      const [negativePrompt, setNegativePrompt] = useState(DEFAULT_NEGATIVE);
      const [exportFormat, setExportFormat] = useState('png');
      const [variationCount, setVariationCount] = useState(1);

      const [showGrid, setShowGrid] = useState(false);
      const [zoomed, setZoomed] = useState(false);
      const [referenceImage, setReferenceImage] = useState('');

      const [prompt, setPrompt] = useState('');
      const [enhancedPrompt, setEnhancedPrompt] = useState('');
      const [isEnhancing, setIsEnhancing] = useState(false);
      const [isGenerating, setIsGenerating] = useState(false);
      const [progress, setProgress] = useState(0);

      const [activeOutput, setActiveOutput] = useState(null);
      const [history, setHistory] = useState([]);
      const [savedPrompts, setSavedPrompts] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('shivalali_saved_prompts') || '[]');
        } catch {
          return [];
        }
      });
      const [toast, setToast] = useState(null);

      const [showOwnerModal, setShowOwnerModal] = useState(false);
      const [passcodeInput, setPasscodeInput] = useState('');
      const [passcodeError, setPasscodeError] = useState('');

      const [showPricingModal, setShowPricingModal] = useState(false);
      const [selectedPlan, setSelectedPlan] = useState(null);
      const [paymentMethod, setPaymentMethod] = useState('UPI');
      const [paymentSuccess, setPaymentSuccess] = useState('');

      const [showApiModal, setShowApiModal] = useState(false);
      const [geminiKey, setGeminiKey] = useState(() => localStorage.getItem('shivalali_gemini_key') || '');
      const [customEndpoint, setCustomEndpoint] = useState(() => localStorage.getItem('shivalali_custom_endpoint') || '');

      const canvasRef = useRef(null);
      const importInputRef = useRef(null);
      const refImageInputRef = useRef(null);

      const notify = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      useEffect(() => {
        if (activeOutput && !activeOutput.imageUrl && canvasRef.current) {
          renderProceduralCanvas(canvasRef.current, activeOutput);
        }
      }, [activeOutput]);

      useEffect(() => {
        try {
          localStorage.setItem('shivalali_saved_prompts', JSON.stringify(savedPrompts));
        } catch {}
      }, [savedPrompts]);

      const handleSavePromptPreset = () => {
        const text = (prompt || enhancedPrompt).trim();
        if (!text) {
          notify('Write a prompt before saving');
          return;
        }
        const entry = {
          id: Date.now(),
          text,
          ratioId: aspectRatio.id,
          preset,
          seed
        };
        setSavedPrompts((prev) => [entry, ...prev.slice(0, 19)]);
        notify('Prompt Saved to Library');
      };

      const handleDeleteSavedPrompt = (id) => {
        setSavedPrompts((prev) => prev.filter((item) => item.id !== id));
        notify('Removed from Saved Library');
      };

      const handleExportPresetsJson = () => {
        const payload = JSON.stringify({ brand: 'ShivaLali', exportedAt: new Date().toISOString(), presets: savedPrompts }, null, 2);
        const blob = new Blob([payload], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'ShivaLali-Presets.json';
        link.click();
        URL.revokeObjectURL(url);
        notify('Presets Exported (JSON)');
      };

      const handleImportPresetsJson = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(String(ev.target?.result || '{}'));
            const incoming = Array.isArray(parsed) ? parsed : parsed.presets;
            if (Array.isArray(incoming) && incoming.length > 0) {
              const cleaned = incoming
                .filter((p) => p && typeof p.text === 'string' && p.text.trim())
                .map((p, idx) => ({
                  id: Date.now() + idx,
                  text: p.text.trim(),
                  ratioId: p.ratioId || '16:9',
                  preset: p.preset || 'editorial',
                  seed: p.seed || generateRandomSeed()
                }));
              setSavedPrompts((prev) => [...cleaned, ...prev].slice(0, 25));
              notify(`Imported ${cleaned.length} Presets`);
            } else {
              notify('No valid presets found in JSON');
            }
          } catch {
            notify('Invalid JSON file');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const handleReferenceUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          if (typeof ev.target?.result === 'string') {
            setReferenceImage(ev.target.result);
            notify('Reference Guide Loaded');
          }
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      };

      const handleMagicEnhance = async () => {
        setIsEnhancing(true);
        const base = prompt.trim() || 'luxury modern family villa exterior with manicured lawn at golden hour';

        if (geminiKey.trim()) {
          try {
            const res = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(geminiKey.trim())}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{
                    parts: [{
                      text: `Expand this into a single concise ultra-photorealistic ${mode} generation prompt. Include camera lens (${lens}), lighting (${lighting}), style (${preset}), authentic textures, balanced negative space, 8k raw photography, and end with "--no ${negativePrompt}". Input: "${base}"`
                    }]
                  }]
                })
              }
            );
            const data = await res.json();
            const aiText = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
            if (aiText) {
              setEnhancedPrompt(aiText);
              setPrompt(aiText);
              setIsEnhancing(false);
              notify('Magic Prompt Enhanced');
              return;
            }
          } catch (e) {}
        }

        await new Promise((r) => setTimeout(r, 400));
        const expanded = enhancePromptText(base, preset, lens, lighting, mode, negativePrompt);
        setEnhancedPrompt(expanded);
        setPrompt(expanded);
        setIsEnhancing(false);
        notify('Magic Prompt Enhanced');
      };

      const handleGenerate = async () => {
        const neededCredits = variationCount;
        if (!isOwner && credits < neededCredits) {
          setShowPricingModal(true);
          notify(`Need ${neededCredits} credit(s) — Upgrade to continue`);
          return;
        }

        const baseSeed = Number(seed) || generateRandomSeed();
        const finalPrompt = (enhancedPrompt || prompt).trim() || enhancePromptText('serene coastal cliffside villa at sunrise', preset, lens, lighting, mode, negativePrompt);
        setIsGenerating(true);
        setProgress(15);

        const timer = setInterval(() => {
          setProgress((p) => (p < 88 ? p + Math.floor(Math.random() * 14) + 6 : p));
        }, 200);

        const batchItems = [];
        const supportedImagenRatios = ['1:1', '3:4', '4:3', '9:16', '16:9'];
        const apiRatio = supportedImagenRatios.includes(aspectRatio.id) ? aspectRatio.id : '16:9';

        for (let i = 0; i < variationCount; i++) {
          const itemSeed = baseSeed + i;
          let generatedImageUrl = null;

          if (geminiKey.trim() && mode === 'image') {
            try {
              const res = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict?key=${encodeURIComponent(geminiKey.trim())}`,
                {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    instances: [{ prompt: finalPrompt }],
                    parameters: { sampleCount: 1, aspectRatio: apiRatio, seed: itemSeed }
                  })
                }
              );
              const data = await res.json();
              const b64 = data?.predictions?.[0]?.bytesBase64Encoded;
              const mime = data?.predictions?.[0]?.mimeType || 'image/png';
              if (b64) {
                generatedImageUrl = `data:${mime};base64,${b64}`;
              }
            } catch (err) {}
          }

          batchItems.push({
            id: Date.now() + i,
            mode,
            seed: itemSeed,
            prompt: finalPrompt,
            preset,
            lens,
            lighting,
            ratio: aspectRatio,
            watermarked: !isOwner,
            imageUrl: generatedImageUrl,
            createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
        }

        await new Promise((r) => setTimeout(r, 750));
        clearInterval(timer);
        setProgress(100);

        if (!isOwner) {
          setCredits((c) => Math.max(0, c - neededCredits));
        }

        setActiveOutput(batchItems[0]);
        setHistory((prev) => [...batchItems.reverse(), ...prev].slice(0, 24));
        setIsGenerating(false);
        setTimeout(() => setProgress(0), 300);
        notify(
          isOwner
            ? `Generated ${variationCount}x (Owner Unlimited • Seed ${baseSeed})`
            : `Generated ${variationCount}x (-${neededCredits} Credit${neededCredits > 1 ? 's' : ''})`
        );
      };

      const handleDownloadHighRes = () => {
        if (!activeOutput) return;
        const ext = exportFormat === 'jpg' ? 'jpg' : 'png';
        const mime = exportFormat === 'jpg' ? 'image/jpeg' : 'image/png';
        const filename = `ShivaLali-${activeOutput.mode}-${activeOutput.ratio.id.replace(':', 'x')}-${activeOutput.seed || activeOutput.id}.${ext}`;

        if (activeOutput.imageUrl) {
          const link = document.createElement('a');
          link.href = activeOutput.imageUrl;
          link.download = filename;
          link.click();
          notify(`Exported ${ext.toUpperCase()}`);
          return;
        }
        if (canvasRef.current) {
          const link = document.createElement('a');
          link.href = canvasRef.current.toDataURL(mime, 0.96);
          link.download = filename;
          link.click();
          notify(`Exported ${ext.toUpperCase()}`);
        }
      };

      const handleCopyPrompt = () => {
        const textToCopy = (enhancedPrompt || prompt || activeOutput?.prompt || '').trim();
        if (!textToCopy) {
          notify('Enter or enhance a prompt first');
          return;
        }
        navigator.clipboard?.writeText(textToCopy);
        notify('Prompt Copied');
      };

      const handleUnlockOwner = (e) => {
        e.preventDefault();
        if (passcodeInput.trim() === 'ADMIN123') {
          setIsOwner(true);
          setShowOwnerModal(false);
          setPasscodeInput('');
          setPasscodeError('');
          notify('ShivaLali Owner Unlimited Mode Activated');
        } else {
          setPasscodeError('Invalid passcode. Hint: ADMIN123');
        }
      };

      const handleCompleteCheckout = (plan) => {
        setPaymentSuccess(`Processing ${paymentMethod} for ${plan.name} (${plan.price})...`);
        setTimeout(() => {
          setCredits((c) => c + plan.creditBonus);
          setPaymentSuccess('');
          setSelectedPlan(null);
          setShowPricingModal(false);
          notify(`${plan.name} Activated! +${plan.creditBonus} Credits Added`);
        }, 800);
      };

      const saveApiSettings = () => {
        localStorage.setItem('shivalali_gemini_key', geminiKey.trim());
        localStorage.setItem('shivalali_custom_endpoint', customEndpoint.trim());
        setShowApiModal(false);
        notify('API Configuration Saved');
      };

      const plans = [
        {
          id: 'starter',
          name: 'Starter',
          price: '₹199',
          period: '/month',
          badge: null,
          creditBonus: 100,
          features: ['100 Generations / mo', 'All Standard Aspect Ratios', 'Commercial License', 'Fast Cloud Queue']
        },
        {
          id: 'pro',
          name: 'Pro Studio',
          price: '₹499',
          period: '/month',
          badge: 'Most Popular',
          creditBonus: 500,
          features: ['500 Generations / mo', 'Every Aspect Ratio Unlocked', 'Full Commercial Rights', 'Zero Watermark Export']
        },
        {
          id: 'agency',
          name: 'Unlimited',
          price: '₹999',
          period: '/month',
          badge: 'Scale Tier',
          creditBonus: 9999,
          features: ['Unlimited Generations', '4K High-Res Upscaling', 'Priority Video Rendering', 'Full Commercial Rights']
        }
      ];

      return (
        <div className="min-h-screen bg-[#09090B] text-zinc-100 flex flex-col relative selection:bg-violet-600/40 selection:text-amber-200">
          {/* Subtle Ambient Glows */}
          <div className="pointer-events-none fixed inset-0 overflow-hidden z-0">
            <div className="absolute -top-40 left-1/4 w-[420px] h-[420px] rounded-full bg-[#7C3AED]/12 blur-[120px]" />
